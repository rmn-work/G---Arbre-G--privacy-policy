<div style="text-align:center; padding:50px;">
    <h2>Entrez le code reçu par mail</h2>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="code" placeholder="123456" style="font-size:24px; text-align:center;">
        <br><br>
        <button type="submit" style="padding:10px 20px;">Valider mon compte</button>
    </form>
    {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
</div>
